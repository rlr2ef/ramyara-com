# The Background tab, as chapters (newest first).
#
# years:     the dates shown on the left
# name:      the chapter's short name under the dates
# highlight: true gives the chapter a soft green background
# logo:      optional logo file in assets/logos/, shown above the heading
# heading:   the main thing in this chapter (shown when there's no logo, or under it)
# role:      one italic line under the heading
# points:    bullet points. Links look like [text](https://...)
# alongside: what ran in parallel. Each has text, when, and an optional logo.

