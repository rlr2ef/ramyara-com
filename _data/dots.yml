# Every dot on the map. Add a new dot by copying one block and changing it.
#
# id:      a short unique name, no spaces
# title:   what shows next to the dot
# buckets: one or more bucket ids from buckets.yml (more than one = it sits between them)
# kind:    the small grey line under the title (role, year, publication)
# text:    the story. Links look like [text](https://...)
# photos:  optional. Files live in assets/photos/. Caption is optional.
# x, y:    optional. Where the dot sits (map is 1000 x 640). Leave them out and the site places it for you.
# label:   optional. Where the title sits next to the dot: right (default), left, above, below, below-left, below-right

